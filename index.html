<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 6 Months ❤️</title>
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#4facfe,#ff69b4);
color:white;
text-align:center;
overflow-x:hidden;
}
.container{
padding:40px 20px;
}
h1{
font-size:3em;
animation:fade 2s ease;
}
p{
font-size:1.2em;
}
img{
width:250px;
border-radius:20px;
margin:15px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}
button{
padding:15px 30px;
font-size:18px;
border:none;
border-radius:30px;
background:white;
color:#ff1493;
cursor:pointer;
}
@keyframes fade{
from{opacity:0;transform:translateY(40px);}
to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<div class="container">
<h1>Happy 6 Months ❤️</h1>

<p>From <b>1 February 2026</b> to <b>1 August 2026</b><br>
Every moment with you is my favorite memory.</p>

<img src="https://picsum.photos/300/400" alt="Our Photo">

<br><br>

<button onclick="alert('I Love You Forever ❤️')">
Click Me 💖
</button>

</div>

</body>
</html>
